<title>Looks Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a quiet neutral page so the previews carry all the color. A sticky
   toolbar over a card grid, one mock Claude window per look, and a detail view. */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --ink: #14171c;
  --ink2: #4a5262;
  --line: #d5d9e1;
  --accent: #4a3fd0;
  --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgba(20, 23, 28, .08), 0 8px 24px rgba(20, 23, 28, .06);
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13; --surface: #171a20; --ink: #eceef3; --ink2: #a3abb9; --line: #2a303a;
    --accent: #a094ff; --accent-ink: #0d0f13;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f13; --surface: #171a20; --ink: #eceef3; --ink2: #a3abb9; --line: #2a303a;
  --accent: #a094ff; --accent-ink: #0d0f13;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body);
  padding-block: 0 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ---- toolbar ---- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-block: 22px 14px; border-bottom: 1px solid var(--line);
}
.top-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 16px; }
h1 { font: 600 28px/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
.lede { margin: 0; color: var(--ink2); font-size: 14px; flex: 1 1 340px; min-width: 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { position: relative; flex: 1 1 240px; min-width: 0; max-width: 420px; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; color: var(--ink2); pointer-events: none; }
.search input {
  width: 100%; height: 40px; padding: 0 12px 0 36px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line);
}
.search input::placeholder { color: var(--ink2); opacity: .8; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--ink2); cursor: pointer; font-weight: 500; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sel { height: 40px; padding: 0 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; cursor: pointer; }
.count { margin-left: auto; color: var(--ink2); font-size: 13px; font-variant-numeric: tabular-nums; }

/* ---- grid ---- */
.grid { display: grid; gap: 30px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); padding-top: 26px; }
.card { all: unset; box-sizing: border-box; display: block; cursor: pointer; border-radius: 14px; min-width: 0; }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.card .pv { transition: transform .18s ease, box-shadow .18s ease; }
.card:hover .pv { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 14px 32px rgba(0, 0, 0, .18); }
.meta { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px 2px 0; }
.meta-text { min-width: 0; }
.name { font: 600 16px/1.25 var(--display); margin: 0; overflow-wrap: anywhere; }
.by { color: var(--ink2); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
.dots { display: flex; gap: 5px; flex: none; padding-top: 3px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); }
.empty { grid-column: 1 / -1; text-align: center; padding: 70px 0; color: var(--ink2); }
.empty button { margin-top: 12px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }

/* ---- the mock Claude window. Every size is in cqw so the preview scales from a card to the detail view. ---- */
.pv {
  container-type: inline-size; position: relative; aspect-ratio: 16 / 10; width: 100%;
  border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); isolation: isolate;
}
.pv-sky { position: absolute; inset: 0; background:
  radial-gradient(60% 70% at 85% 15%, color-mix(in srgb, var(--glow) 16%, transparent), transparent),
  linear-gradient(180deg, var(--sky0) 0%, var(--sky1) 50%, var(--sky2) 100%); }
.pv-win { position: absolute; inset: 0; display: flex; flex-direction: column; color: var(--tp); font: 400 2.15cqw/1.35 var(--body); }
.pv-win * { margin: 0; }
.pv-bar {
  height: 5.6cqw; flex: none; display: flex; align-items: center; gap: 1cqw; padding: 0 2cqw;
  background: color-mix(in srgb, var(--s0) 45%, transparent); backdrop-filter: blur(1.1cqw);
  border-bottom: .12cqw solid color-mix(in srgb, var(--tm) 18%, transparent);
}
.pv-bar .d { width: 1.15cqw; height: 1.15cqw; border-radius: 50%; background: color-mix(in srgb, var(--tm) 45%, transparent); }
.pv-bar .t { margin-left: 1.6cqw; font-size: 2cqw; color: var(--ts); }
.pv-bar .sp { flex: 1; }
.pv-bar .ic { width: 1.7cqw; height: 1.7cqw; border-radius: .4cqw; box-shadow: inset 0 0 0 .2cqw color-mix(in srgb, var(--tm) 55%, transparent); }
.pv-chat { flex: 1; min-height: 0; width: 64cqw; margin: 0 auto; padding-top: 3.2cqw; display: flex; flex-direction: column; gap: 2cqw; overflow: hidden; }
.pv-user {
  align-self: flex-end; max-width: 80%; padding: 1.3cqw 2.2cqw; border-radius: 2.2cqw;
  background: color-mix(in srgb, var(--s2) 70%, transparent); backdrop-filter: blur(1.1cqw);
  box-shadow: inset 0 0 0 .12cqw color-mix(in srgb, var(--tm) 20%, transparent);
}
.pv-tool { display: flex; gap: 1.2cqw; align-items: baseline; color: var(--tm); }
.pv-tool b { font-weight: 500; color: var(--ts); }
.pv-tool .a { color: var(--ga); } .pv-tool .r { color: var(--gd); }
.pv-ai strong { font-weight: 600; }
.pv-code {
  padding: 1.5cqw 2.2cqw; border-radius: 1.7cqw; font: 400 1.95cqw/1.55 var(--mono); white-space: pre; overflow: hidden;
  background: color-mix(in srgb, var(--s1) 72%, transparent); backdrop-filter: blur(1.1cqw);
  box-shadow: inset 0 0 0 .12cqw color-mix(in srgb, var(--tm) 20%, transparent);
}
.pv-code .k { color: var(--ac); } .pv-code .n { color: var(--dg); } .pv-code .v { color: var(--wn); }
.pv-code .s { color: var(--sc); } .pv-code .l { color: var(--pr); }
.pv-composer {
  flex: none; width: 64cqw; height: 6.4cqw; margin: 0 auto; border-radius: 3.2cqw; display: flex; align-items: center; gap: 1.8cqw; padding: 0 1.6cqw 0 2.4cqw;
  background: color-mix(in srgb, var(--s1) 62%, transparent); backdrop-filter: blur(1.1cqw);
  box-shadow: inset 0 0 0 .14cqw color-mix(in srgb, var(--tm) 26%, transparent);
}
.pv-composer .plus { color: var(--tm); font-size: 3cqw; line-height: 1; }
.pv-composer .ph { flex: 1; color: var(--tm); }
.pv-composer .send { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--on); font-size: 2cqw; font-weight: 600; }
.pv-foot { flex: none; width: 64cqw; margin: 0 auto; padding: 1cqw 1cqw 1.6cqw; text-align: right; font-size: 1.75cqw; color: var(--tm); }

/* ---- detail view ---- */
.veil { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 14, .62); backdrop-filter: blur(6px); overflow-y: auto; padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { max-width: 1100px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 24px; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
.sheet .pv { box-shadow: none; border: 1px solid var(--line); }
.side { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.side h2 { font: 600 24px/1.15 var(--display); margin: 0; overflow-wrap: anywhere; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink2); }
.credit { margin: 0; color: var(--ink2); font-size: 13.5px; }
.sw-group h3 { margin: 0 0 6px; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.sw div { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; }
.sw i { width: 20px; height: 20px; border-radius: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .4); }
.sw span { min-width: 0; line-height: 1.2; } .sw small { display: block; font: 400 11px/1.2 var(--mono); color: var(--ink2); }
.cmd { display: grid; gap: 4px; }
.cmd label { font-size: 12.5px; color: var(--ink2); }
.cmd .row { display: flex; gap: 8px; align-items: stretch; }
.cmd code { flex: 1; min-width: 0; padding: 9px 10px; border-radius: 9px; background: var(--bg); border: 1px solid var(--line); font: 400 12px/1.4 var(--mono); overflow-x: auto; white-space: nowrap; user-select: all; }
.btn { flex: none; height: auto; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.nav { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.nav .btn { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 820px) { .sheet { grid-template-columns: 1fr; } }
@media (max-width: 560px) { .count { margin-left: 0; width: 100%; } h1 { font-size: 24px; } .search { max-width: none; } }
@media (prefers-reduced-motion: reduce) { .card .pv { transition: none; } .card:hover .pv { transform: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="top-head">
      <h1>Looks Gallery</h1>
      <p class="lede">Every look for the Claude desktop app, previewed as a conversation in its own colors, with the gradient backdrop and frosted panels the app draws. Previews are mock-ups built from each look's colors, not screenshots. <a href="https://github.com/briannaworkman/looks" target="_blank" rel="noopener">Get them on GitHub</a>.</p>
    </div>
    <div class="controls">
      <label class="search"><span class="sr">Search looks</span>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
        <input id="q" type="search" placeholder="Search by name or author" autocomplete="off">
      </label>
      <div class="seg" id="modeSeg" role="group" aria-label="Light or dark">
        <button type="button" data-v="all" aria-pressed="true">All</button>
        <button type="button" data-v="dark" aria-pressed="false">Dark</button>
        <button type="button" data-v="light" aria-pressed="false">Light</button>
      </div>
      <select class="sel" id="src" aria-label="Source">
        <option value="all">All sources</option>
        <option value="palette">Published palettes</option>
        <option value="vscode">VS Code themes</option>
        <option value="original">Original looks</option>
      </select>
      <select class="sel" id="sort" aria-label="Sort">
        <option value="featured">Sort: Featured</option>
        <option value="az">Sort: A to Z</option>
      </select>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </header>
  <main class="grid" id="grid"></main>
</div>

<div class="veil" id="veil" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dName"></div>
</div>

ta/vscode-beautiful-ui","ext":"swashata.beautiful-ui","sky":["#191b20","#243647","#262a31"],"glow":"#1683dc","c":{"s0":"#262a31","s1":"#2a2e36","s2":"#2d323a","s3":"#30353e","tp":"#e5e7eb","ts":"#bbbdc2","tm":"#a1a4a9","accent":"#64a9eb","danger":"#e2848c","success":"#579c00","warning":"#cd9951","pro":"#c185ea","fill":"#057bd5","on":"#000000","gitAdd":"#5ea702","gitDel":"#e1747d"}},{"id":"ui-one-light","name":"βui - One Light","mode":"light","origin":"vscode","by":"swashata","palette":null,"license":"MIT","repo":"swashata/vscode-beautiful-ui","ext":"swashata.beautiful-ui","sky":["#e3e3e3","#d8deea","#fafafa"],"glow":"#0e46c0","c":{"s0":"#efefef","s1":"#f5f5f5","s2":"#fafafa","s3":"#fafafa","tp":"#383942","ts":"#55565d","tm":"#606168","accent":"#0941bb","danger":"#912318","success":"#325e00","warning":"#6d4900","pro":"#005d5c","fill":"#1c6bff","on":"#ffffff","gitAdd":"#5ea702","gitDel":"#e03d2e"}}];
const REPO = "briannaworkman/looks";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const state = { mode: "all", src: "all", sort: "featured", q: "" };
let shown = [];
let openIndex = -1;
let lastFocus = null;

/* One mock Claude window, painted with a look's own colors. */
function vars(l) {
  const c = l.c;
  return `--sky0:${l.sky[0]};--sky1:${l.sky[1]};--sky2:${l.sky[2]};--glow:${l.glow};` +
    `--s0:${c.s0};--s1:${c.s1};--s2:${c.s2};--s3:${c.s3};--tp:${c.tp};--ts:${c.ts};--tm:${c.tm};` +
    `--ac:${c.accent};--dg:${c.danger};--sc:${c.success};--wn:${c.warning};--pr:${c.pro};` +
    `--fill:${c.fill};--on:${c.on};--ga:${c.gitAdd};--gd:${c.gitDel};`;
}
function preview(l) {
  return `<div class="pv" style="${vars(l)}" aria-hidden="true"><div class="pv-sky"></div><div class="pv-win">
    <div class="pv-bar"><i class="d"></i><i class="d"></i><i class="d"></i><span class="t">Cook time badges</span><span class="sp"></span><i class="ic"></i><i class="ic"></i><i class="ic"></i></div>
    <div class="pv-chat">
      <div class="pv-user">add a cook time badge to each recipe card</div>
      <p class="pv-ai">Nice idea. Let me look at the recipe card.</p>
      <p class="pv-tool"><span>Read and edited</span><b>app.js</b><span class="a">+12</span><span class="r">&minus;3</span></p>
      <div class="pv-code"><span class="k">function</span> <span class="n">badge</span>(<span class="v">recipe</span>) {
  <span class="k">const</span> <span class="v">mins</span> = <span class="l">20</span>;
  <span class="k">return</span> <span class="s">\`\${mins} min\`</span>;
}</div>
      <p class="pv-ai">Done! Every recipe card now shows a <strong>cook time badge</strong>.</p>
    </div>
    <div class="pv-composer"><span class="plus">+</span><span class="ph">Type / for commands</span><span class="send">&uarr;</span></div>
    <div class="pv-foot">Sonnet 5.5 &nbsp; High &nbsp; Auto</div>
  </div></div>`;
}
const byline = l => l.origin === "original" ? "Original look" : l.origin === "vscode" ? `by ${l.by}` : `by ${l.by}`;
const dots = l => [l.c.accent, l.c.danger, l.c.success, l.c.warning, l.c.pro].map(h => `<i style="background:${h}"></i>`).join("");

function card(l, i) {
  return `<button type="button" class="card" data-i="${i}" aria-label="${esc(l.name)}, ${l.mode} look. Open details">${preview(l)}
    <div class="meta"><div class="meta-text"><p class="name">${esc(l.name)}</p><p class="by">${esc(byline(l))}</p></div><div class="dots" aria-hidden="true">${dots(l)}</div></div></button>`;
}

function apply() {
  const q = state.q.trim().toLowerCase();
  shown = LOOKS.filter(l =>
    (state.mode === "all" || l.mode === state.mode) &&
    (state.src === "all" || l.origin === state.src) &&
    (!q || [l.name, l.by, l.id, l.palette, l.ext].some(s => s && s.toLowerCase().includes(q))));
  if (state.sort === "az") shown = [...shown].sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));
  $("grid").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty"><p>No looks match that search.</p><button type="button" id="clear">Clear filters</button></div>`;
  $("count").textContent = shown.length === LOOKS.length ? `${LOOKS.length} looks` : `${shown.length} of ${LOOKS.length} looks`;
}

/* The detail view: a large preview, the real colors, and the commands that install it. */
function swatch(label, hex) { return `<div><i style="background:${hex}"></i><span>${label}<small>${hex}</small></span></div>`; }
function openLook(i, focusEl) {
  const l = shown[i]; if (!l) return;
  openIndex = i; if (focusEl) lastFocus = focusEl;
  const c = l.c;
  const origin = l.origin === "vscode"
    ? `Colors adapted from <a href="https://github.com/${esc(l.repo)}" target="_blank" rel="noopener">${esc(l.ext)}</a> by ${esc(l.by)} (${esc(l.license)}).`
    : l.origin === "palette" ? `Uses the ${esc(l.palette)} palette, made by ${esc(l.by)}.` : "A look made for this gallery.";
  const tags = [l.mode === "dark" ? "Dark" : "Light", l.origin === "vscode" ? "VS Code theme" : l.origin === "palette" ? "Published palette" : "Original"];
  const install = `/plugin install look-${l.id} --marketplace ${REPO}`;
  const sw = `/look ${l.id}`;
  $("sheet").innerHTML = `<div>${preview(l)}</div>
    <div class="side">
      <div><h2 id="dName">${esc(l.name)}</h2><div class="tags" style="margin-top:8px">${tags.map(t => `<span class="tag">${t}</span>`).join("")}</div></div>
      <p class="credit">${origin}</p>
      <div class="sw-group"><h3>Surfaces</h3><div class="sw">${swatch("Page", c.s0)}${swatch("Card", c.s1)}${swatch("Panel", c.s2)}${swatch("Menu", c.s3)}</div></div>
      <div class="sw-group"><h3>Text</h3><div class="sw">${swatch("Primary", c.tp)}${swatch("Secondary", c.ts)}${swatch("Muted", c.tm)}</div></div>
      <div class="sw-group"><h3>Roles</h3><div class="sw">${swatch("Accent", c.accent)}${swatch("Danger", c.danger)}${swatch("Success", c.success)}${swatch("Warning", c.warning)}${swatch("Pro", c.pro)}</div></div>
      <div class="cmd"><label for="c1">Install just this look</label><div class="row"><code id="c1">${esc(install)}</code><button type="button" class="btn primary" data-copy="c1">Copy</button></div></div>
      <div class="cmd"><label for="c2">Or switch to it with the bundle</label><div class="row"><code id="c2">${esc(sw)}</code><button type="button" class="btn" data-copy="c2">Copy</button></div></div>
      <div class="nav"><button type="button" class="btn" id="prev">&larr; Previous</button><button type="button" class="btn" id="next">Next &rarr;</button><button type="button" class="btn" id="close">Close</button></div>
    </div>`;
  const wasHidden = $("veil").hidden;
  $("veil").hidden = false;
  if (wasHidden) document.body.style.overflow = "hidden";
  $("veil").scrollTop = 0;
  $("close").focus();
}
function closeLook() {
  $("veil").hidden = true; document.body.style.overflow = ""; openIndex = -1;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function step(d) { if (shown.length) openLook((openIndex + d + shown.length) % shown.length); }

async function copy(id, btn) {
  const el = $(id), text = el.textContent, old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
  catch (e) {
    const r = document.createRange(); r.selectNodeContents(el);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Selected";
  }
  setTimeout(() => { btn.textContent = old; }, 1400);
}

/* events */
$("q").addEventListener("input", e => { state.q = e.target.value; apply(); });
$("src").addEventListener("change", e => { state.src = e.target.value; apply(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; apply(); });
$("modeSeg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.mode = b.dataset.v;
  document.querySelectorAll("#modeSeg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  apply();
});
$("grid").addEventListener("click", e => {
  if (e.target.id === "clear") {
    Object.assign(state, { mode: "all", src: "all", q: "" });
    $("q").value = ""; $("src").value = "all";
    document.querySelectorAll("#modeSeg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === "all")));
    return apply();
  }
  const c = e.target.closest(".card"); if (c) openLook(Number(c.dataset.i), c);
});
$("veil").addEventListener("click", e => {
  if (e.target === $("veil")) return closeLook();
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.copy) copy(b.dataset.copy, b);
  else if (b.id === "close") closeLook();
  else if (b.id === "prev") step(-1);
  else if (b.id === "next") step(1);
});
document.addEventListener("keydown", e => {
  if ($("veil").hidden) return;
  if (e.key === "Escape") closeLook();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "Tab") {
    const f = [...$("sheet").querySelectorAll("button, a[href]")]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

apply();
</script>
